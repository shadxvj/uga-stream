<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uga Stream — VJ Admin Panel</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: sans-serif; padding: 30px; margin: 0; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 30px auto; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .admin-layout-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 35px; max-width: 1200px; margin: 0 auto; }
        .form-container { background: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #f39c12; height: fit-content; }
        .dashboard-section { background: #111; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 25px; margin-bottom: 30px; }
        h2, h3 { color: #f39c12; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; outline: none; font-size: 0.95rem; }
        input:focus, select:focus { border-color: #f39c12; }
        button { background: #f39c12; color: #000; border: none; width: 100%; padding: 14px; margin-top: 25px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1rem; }
        button:hover { background: #e08e0b; }
        .logout-btn { background: #e50914; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; width: auto; margin: 0; }
        .users-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        .users-table th { background-color: #1a1a1a; color: #f39c12; text-align: left; padding: 12px 10px; border: 1px solid rgba(255,255,255,0.08); }
        #adminMoviesList { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        @media (max-width: 992px) { .admin-layout-grid { grid-template-columns: 1fr; } }
    </style>
    <script>
       document.addEventListener("DOMContentLoaded", () => {
    const isAdminLoggedIn = localStorage.getItem("adminAuthenticated");
    if (isAdminLoggedIn !== "true") {
        const passwordAttempt = prompt("🔒 Restricted Access: Enter Admin Password:");
        if (passwordAttempt === "UgaStream2026") {
            localStorage.setItem("adminAuthenticated", "true");
            fetchAdminMovies(); 
            fetchRegisteredUsers();
            
            // ADDED HERE: Starts the 5-second automatic refresh loop
            setInterval(fetchRegisteredUsers, 5000);
        } else {
            window.location.href = "index.html"; 
        }
    } else {
        fetchAdminMovies(); 
        fetchRegisteredUsers();
        
        // ADDED HERE: Starts the 5-second automatic refresh loop
        setInterval(fetchRegisteredUsers, 5000);
    }
});

        async function fetchAdminMovies() {
            const listContainer = document.getElementById('adminMoviesList');
            if (!listContainer) return;
            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();
                if (!movies || movies.length === 0) {
                    listContainer.innerHTML = `<p style="color: #666; font-style: italic;">No videos uploaded yet.</p>`;
                    return;
                }
                listContainer.innerHTML = ''; 
                movies.forEach(movie => {
                    const row = document.createElement('div');
                    row.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 12px 16px; border-radius: 6px;";
                    row.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${movie.image}" style="width: 45px; height: 60px; object-fit: cover; border-radius: 4px;">
                            <div>
                                <h4 style="margin: 0; color: #fff;">${movie.title}</h4>
                                <p style="margin: 4px 0 0 0; color: #888; font-size: 0.8rem;"><span style="color: #f39c12;">VJ ${movie.vj}</span> • Category: ${movie.category}</p>
                            </div>
                        </div>
                        <button type="button" onclick="deleteMovie(${movie.id})" style="background: #e50914; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; width: auto; margin: 0;">🗑️ Delete</button>
                    `;
                    listContainer.appendChild(row);
                });
            } catch (error) { console.error(error); }
        }

        async function deleteMovie(id) {
            if (confirm("⚠️ Delete this movie?")) {
                const response = await fetch(`/api/movies/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) { fetchAdminMovies(); }
            }
        }

        async function fetchRegisteredUsers() {
            const tableBody = document.getElementById('usersTableBody');
            if (!tableBody) return;
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                tableBody.innerHTML = ''; 
                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08);">${user.username}</td>
                        <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08);">${user.phone}</td>
                        <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08); color: #f39c12; font-weight: bold;">${user.plan}</td>
                        <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08); color: #ff4d4d;">${user.password}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) { console.error(error); }
        }
    </script>
</head>
<body>
    <div class="admin-header">
        <h2>Uga Stream Management Center</h2>
        <button type="button" onclick="localStorage.removeItem('adminAuthenticated'); window.location.reload();" class="logout-btn">🔒 Lock Panel</button>
    </div>
    <div class="admin-layout-grid">
        <div class="form-container">
            <h3>Upload New Content (Link Method)</h3>
            <form id="simpleUploadForm">
                <label>Movie Title:</label>
                <input type="text" id="movieTitle" required placeholder="e.g., Gladiator 2">

                <label>VJ Translator Name:</label>
                <input type="text" id="movieVj" required placeholder="e.g., VJ Jingo">

                <label>Movie Category:</label>
                <select id="movieCategory">
                    <option value="trending">🔥 Trending</option>
                    <option value="action">💥 Action</option>
                    <option value="comedy">😂 Comedy</option>
                    <option value="drama">🎭 Drama</option>
                    <option value="series">📺 Series</option>
                    <option value="animation">🦊 Animation</option>
                </select>

                <label>Poster Image URL:</label>
                <input type="text" id="posterUrl" required placeholder="Paste Cloudinary Poster .jpg link">

                <label>Video Stream URL:</label>
                <input type="text" id="videoUrl" required placeholder="Paste Cloudinary Video .mp4 link">

                <button type="submit" id="submitBtn">🚀 Publish Movie to App</button>
            </form>
        </div>
        <div>
            <div class="dashboard-section">
                <h3>Live Movie Registry Catalog</h3>
                <div id="adminMoviesList"></div>
            </div>
            <div class="dashboard-section">
                <h3>Registered User Database Metrics</h3>
                <table class="users-table">
                    <thead><tr><th>Username</th><th>Phone</th><th>Tier Plan</th><th>Access Key</th></tr></thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('simpleUploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Publishing...";

            const response = await fetch('/api/upload-movie', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('movieTitle').value,
                    vj: document.getElementById('movieVj').value,
                    category: document.getElementById('movieCategory').value,
                    posterUrl: document.getElementById('posterUrl').value,
                    videoUrl: document.getElementById('videoUrl').value
                })
            });

            if (response.ok) {
                alert("✅ Success: Movie published instantly!");
                window.location.reload();
            } else {
                alert("❌ Upload failed.");
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 Publish Movie to App";
            }
        });
    </script>
</body>
</html>
