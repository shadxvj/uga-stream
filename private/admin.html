<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uga Stream — VJ Admin Panel</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: sans-serif; padding: 30px; margin: 0; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 30px auto; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .admin-layout-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 35px; max-width: 1200px; margin: 0 auto; }
        .form-container { background: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #f39c12; height: fit-content; }
        .dashboard-section { background: #111; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 25px; margin-bottom: 30px; }
        h2, h3 { color: #f39c12; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; outline: none; font-size: 0.95rem; }
        input:focus, select:focus { border-color: #f39c12; }
        button { background: #f39c12; color: #000; border: none; width: 100%; padding: 14px; margin-top: 25px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1rem; }
        button:hover { background: #e08e0b; }
        .logout-btn { background: #e50914; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; width: auto; margin: 0; }
        .users-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        .users-table th { background-color: #1a1a1a; color: #f39c12; text-align: left; padding: 12px 10px; border: 1px solid rgba(255,255,255,0.08); }
        #adminMoviesList { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        @media (max-width: 992px) { .admin-layout-grid { grid-template-columns: 1fr; } }
                /* Progress Bar Styling Container Hooks */
        .progress-wrapper { display: none; margin-top: 20px; background: #222; border-radius: 4px; height: 20px; overflow: hidden; border: 1px solid #444; }
        .progress-fill { background: linear-gradient(to right, #f39c12, #e08e0b); width: 0%; height: 100%; text-align: center; color: black; font-weight: bold; font-size: 0.8rem; line-height: 20px; transition: width 0.1s ease; }

    </style>
    <script>
       document.addEventListener("DOMContentLoaded", () => {
    const isAdminLoggedIn = localStorage.getItem("adminAuthenticated");
    if (isAdminLoggedIn !== "true") {
        const passwordAttempt = prompt("🔒 Restricted Access: Enter Admin Password:");
        if (passwordAttempt === "UgaStream2026") {
            localStorage.setItem("adminAuthenticated", "true");
            fetchAdminMovies(); 
            fetchRegisteredUsers();
            
            // ADDED HERE: Starts the 5-second automatic refresh loop
            setInterval(fetchRegisteredUsers, 5000);
        } else {
            window.location.href = "index.html"; 
        }
    } else {
        fetchAdminMovies(); 
        fetchRegisteredUsers();
           // HIGH-SPEED DIRECT BROWSER-TO-STORJ DCS UPLOADER PIPELINE (NO SIZE LIMITS)
         // HIGH-SPEED DIRECT BROWSER-TO-STORJ DCS UPLOADER PIPELINE
        document.addEventListener("DOMContentLoaded", () => {
            // UNIVERSAL SELECTOR: Grabs the form no matter what ID name it has!
            const form = document.querySelector('form');
            if(!form) return;
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Handles both ID variants cleanly to prevent null runtime crashes
                const title = document.getElementById('movieTitle')?.value || document.getElementById('title')?.value;
                const vj = document.getElementById('movieVJ')?.value || document.getElementById('vj')?.value;
                const category = document.getElementById('category')?.value || 'trending';
                const posterUrl = document.getElementById('posterUrl').value;
                const videoFile = document.getElementById('videoFile').files[0]; // Fixed file stream mapping

                if (!videoFile) {
                    alert("Please select a video file first.");
                    return;
                }

                const submitBtn = document.getElementById('submitBtn') || document.querySelector('button[type="submit"]');
                const progressWrapper = document.getElementById('progressWrapper');
                const progressFill = document.getElementById('progressFill');

                try {
                    submitBtn.disabled = true;
                    submitBtn.innerText = "Processing Authorization...";
                    if(progressWrapper) progressWrapper.style.style.display = "block";

                    // Step 1: Fetch authenticated S3 link
                    const linkRequest = await fetch('/api/admin/get-b2-upload-link', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: videoFile.name, filetype: videoFile.type })
                    });

                    const linkData = await linkRequest.json();
                    if (!linkData.success) throw new Error(linkData.message || "Failed to generate storage link.");

                    submitBtn.innerText = "Streaming Movie to Cloud (Keep window open)...";

                    // Step 2: Stream packets directly to Storj DCS
                    const xhr = new XMLHttpRequest();
                    xhr.open('PUT', linkData.uploadUrl, true);
                    xhr.setRequestHeader('Content-Type', videoFile.type);

                    xhr.upload.onprogress = (event) => {
                        if (event.lengthComputable && progressFill) {
                            const percentComplete = Math.round((event.loaded / event.total) * 100);
                            progressFill.style.width = percentComplete + '%';
                            progressFill.innerText = percentComplete + '%';
                        }
                    };

                    xhr.onload = async () => {
                        if (xhr.status === 200 || xhr.status === 201) {
                            if(progressFill) progressFill.innerText = "Saving to Database...";
                            
                            // Step 3: Publish to app layout
                            const finalPublish = await fetch('/api/upload-movie', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    title, vj, category, posterUrl, videoUrl: linkData.publicUrl
                                })
                            });

                            const publishResult = await finalPublish.json();
                            if (publishResult.success) {
                                alert("🎬 " + title + " has been successfully published to UGA STREAM!");
                                form.reset();
                                if(progressWrapper) progressWrapper.style.style.display = "none";
                                location.reload();
                            } else {
                                alert("Database registry failed: " + publishResult.message);
                            }
                        } else {
                            alert("Storage network rejected file stream chunks.");
                        }
                    };

                    xhr.onerror = () => { alert("Network connection dropped mid-transit."); };
                    xhr.onloadend = () => {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "🚀 Publish Movie to App";
                    };
                    xhr.send(videoFile);

                } catch (err) {
                    alert("Upload failed: " + err.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🚀 Publish Movie to App";
                }
            });
        });

     
        // ADDED HERE: Starts the 5-second automatic refresh loop
        setInterval(fetchRegisteredUsers, 5000);
    }
});

        async function fetchAdminMovies() {
            const listContainer = document.getElementById('adminMoviesList');
            if (!listContainer) return;
            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();
                if (!movies || movies.length === 0) {
                    listContainer.innerHTML = `<p style="color: #666; font-style: italic;">No videos uploaded yet.</p>`;
                    return;
                }
                listContainer.innerHTML = ''; 
                movies.forEach(movie => {
                    const row = document.createElement('div');
                    row.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 12px 16px; border-radius: 6px;";
                    row.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${movie.image}" style="width: 45px; height: 60px; object-fit: cover; border-radius: 4px;">
                            <div>
                                <h4 style="margin: 0; color: #fff;">${movie.title}</h4>
                                <p style="margin: 4px 0 0 0; color: #888; font-size: 0.8rem;"><span style="color: #f39c12;">VJ ${movie.vj}</span> • Category: ${movie.category}</p>
                            </div>
                        </div>
                        <button type="button" onclick="deleteMovie(${movie.id})" style="background: #e50914; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; width: auto; margin: 0;">🗑️ Delete</button>
                    `;
                    listContainer.appendChild(row);
                });
            } catch (error) { console.error(error); }
        }

        async function deleteMovie(id) {
            if (confirm("⚠️ Delete this movie?")) {
                const response = await fetch(`/api/movies/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) { fetchAdminMovies(); }
            }
        }

          async function fetchRegisteredUsers() {
            const tableBody = document.getElementById('usersTableBody');
            if (!tableBody) return;
            try {
                const response = await fetch('/api/admin/users-metrics');
                const data = await response.json();
                
                tableBody.innerHTML = ''; 
                if (data.success && data.users && data.users.length > 0) {
                    data.users.forEach(user => {
                        const isUserActive = user.status === "ACTIVE";
                        
                        // 🟢 ACTIVE users stay green, 🔴 PENDING/EXPIRED accounts turn red
                        const badgeColor = isUserActive ? "#2ecc71" : "#e74c3c";
                        const displayStatus = isUserActive ? "ACTIVE" : "PENDING";
                        const statusBadge = `<span style="color: ${badgeColor}; font-weight: bold; background: rgba(0,0,0,0.2); padding: 3px 8px; border-radius: 4px; border: 1px solid ${badgeColor}33; font-size: 0.8rem;">${displayStatus}</span>`;

                        // 🕹️ REVENUE CONTROL BUTTON ENGINE
                        // Displays an Activate confirmation link trigger option only if they are pending payment verification
                        const activateButton = !isUserActive ? 
                            `<button onclick="approveUser('${user.phone}')" style="background: #2ecc71; color: #000; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; width: auto; margin: 0 5px 0 0; display: inline-block; cursor: pointer; border-radius: 3px;">✅ Activate</button>` : '';
                        
                        const deleteButton = `<button onclick="deleteUser('${user.phone}')" style="background: #e50914; color: #fff; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; width: auto; margin: 0; display: inline-block; cursor: pointer; border-radius: 3px;">🗑️ Delete</button>`;

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08);">${user.username}</td>
                            <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08); color: #aaa;">${user.phone}</td>
                            <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08); color: #f39c12; font-weight: bold;">${user.plan}</td>
                            <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08); color: #2ecc71;">${user.accessKey}</td>
                            <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08);">${statusBadge}</td>
                            <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08); color: #95a5a6; font-size: 0.85rem;">${user.timeLeft}</td>
                            <td style="padding: 10px; border: 1px solid rgba(255,255,255,0.08);">${activateButton}${deleteButton}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                } else {
                    tableBody.innerHTML = `<tr><td colspan="7" style="padding: 20px; color: #666; text-align: center;">No registered viewers found in active logs yet.</td></tr>`;
                }
            } catch (error) { console.error("Metrics UI mapping error:", error); }
        }

         // JavaScript Trigger Functions for the buttons
        async function approveUser(phone) {
            const res = await fetch('/api/admin/approve-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });
            const outcome = await res.json();
                    if (outcome.success) { fetchRegisteredUsersMetrics(); }
        }

        async function deleteUser(phone) {
            if (confirm("⚠️ Are you sure you want to completely delete this account record?")) {
                const res = await fetch('/api/admin/delete-user', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const outcome = await res.json();
                if (outcome.success) { fetchRegisteredUsers(); }
            }
        }
    </script>
</head>
<body>
    <div class="admin-header">
        <h2>Uga Stream Management Center</h2>
        <button type="button" onclick="localStorage.removeItem('adminAuthenticated'); window.location.reload();" class="logout-btn">🔒 Lock Panel</button>
    </div>
    <div class="admin-layout-grid">
        <div class="form-container">
            <h3>Upload New Content (Link Method)</h3>
            <form id="mediaUploadForm">
                <label>Movie Title:</label>
                <input type="text" id="movieTitle" required placeholder="e.g., Gladiator 2">

                <label>VJ Translator Name:</label>
                <input type="text" id="movieVJ" required placeholder="e.g., VJ Jingo">

                <label>Movie Category:</label>
                <select id="category">
                    <option value="trending">🔥 Trending</option>
                    <option value="action">💥 Action</option>
                    <option value="comedy">😂 Comedy</option>
                    <option value="drama">🎭 Drama</option>
                    <option value="series">📺 Series</option>
                    <option value="animation">🦊 Animation</option>
                </select>

              <label for="posterFile">Upload Poster Artwork (JPG/PNG):</label>
<input type="file" id="posterFile" accept="image/*" required>
                               <label for="videoFile">Select Movie File (Up to 25GB):</label>
                <input type="file" id="videoFile" accept="video/mp4,video/mkv" required>

                <!-- Live Progress Tracker Elements -->
                <div class="progress-wrapper" id="progressWrapper">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>

                <button type="submit" id="submitBtn">🚀 Publish Movie to App</button>
            </form>
        </div>
        <div>
            <div class="dashboard-section">
                <h3>Live Movie Registry Catalog</h3>
                <div id="adminMoviesList"></div>
            </div>
            <div class="dashboard-section">
                <h3>Registered User Database Metrics</h3>
                <table class="users-table">
                                <thead><tr><th>Username</th><th>Phone</th><th>Tier Plan</th><th>Access Key</th><th>Status</th><th>Time Remaining</th></tr></thead>

                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        // REPLACE LINE 308 WITH THIS EXACT LINE:
(document.getElementById('mediaUploadForm') || document.getElementById('uploadMovieForm') || document.querySelector('form')).addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Publishing...";

                    // 1. Read input parameters safely first
        const title = document.getElementById('movieTitle')?.value || document.getElementById('title')?.value || '';
        const vj = document.getElementById('movieVJ')?.value || document.getElementById('vj')?.value || '';
        const category = document.getElementById('category')?.value || document.getElementById('movieCategory')?.value || 'trending';

                    // CHOOSE THIS SECURE VARIABLE STRUCTURING ASSIGNMENT:
        const posterFile = document.getElementById('posterFile')?.files[0];
        const videoFile = document.getElementById('videoFile')?.files[0];

        if (!posterFile || !videoFile) {
            alert("❌ Please select both a poster image and a video file first.");
            return;
        }

        const submitBtn = document.getElementById('submitBtn') || document.querySelector('button[type="submit"]');
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerText = "Uploading assets to Storj (Please keep this window open)...";
        }

        try {
            // Step 1: Get upload link and upload the Poster Image
            const posterLinkReq = await fetch('/api/admin/get-b2-upload-link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: posterFile.name, filetype: posterFile.type, folder: 'posters' })
            });
            const posterLinkData = await posterLinkReq.json();
            if (!posterLinkData.success) throw new Error("Poster authorization lease failed.");

            await fetch(posterLinkData.uploadUrl, { method: 'PUT', headers: { 'Content-Type': 'posterFile.type' }, body: posterFile });

            // Step 2: Get upload link and upload the Video File
            const videoLinkReq = await fetch('/api/admin/get-b2-upload-link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: videoFile.name, filetype: videoFile.type, folder: 'videos' })
            });
            const videoLinkData = await videoLinkReq.json();
            if (!videoLinkData.success) throw new Error("Video authorization lease failed.");

            // Direct upload stream to Storj
            await fetch(videoLinkData.uploadUrl, { method: 'PUT', headers: { 'Content-Type': videoFile.type }, body: videoFile });

                    // 3. Save the public links returned by Storj straight into your catalog registry
        const response = await fetch('/api/upload-movie', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title,
                vj,
                category,
                posterUrl: posterLinkData.publicUrl,
                videoUrl: videoLinkData.publicUrl
            })
        });

        if (response.ok) {
            alert("✅ Success: Movie published instantly!");
            window.location.reload();
        } else {
            alert("❌ Database registration failed.");
        }

    } catch (error) {
        alert("❌ Ingestion pipeline failed: " + error.message);
    } finally {
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = "Publish Movie to App";
        }
    }
});

    </script>
</body>
</html>
