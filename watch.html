<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // 🛡️ LIVE SERVER-SIDE ACCESS VERIFICATION ENGINE
        (async function() {
            const activeSessionToken = localStorage.getItem('uga_subscriber_session');
            const userProfilePayload = localStorage.getItem('ugaStreamUserSession');

            if (!activeSessionToken || activeSessionToken !== 'true' || !userProfilePayload) {
                alert("🔒 Premium Protected Access! Please log into an active paid account to stream this movie.");
                window.location.href = "index.html?access=locked#login";
                return;
            }

            try {
                const user = JSON.parse(userProfilePayload);
                const response = await fetch('/api/login-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: user.phone,
                        password: user.password || "123456"
                    })
                });

                const databaseCheck = await response.json();

                if (databaseCheck.success !== true) {
                    alert(`🔒 Access Denied: ${databaseCheck.message || 'Subscription verification failed.'}`);
                    localStorage.removeItem('uga_subscriber_session');
                    localStorage.removeItem('uga_user_phone');
                    localStorage.removeItem('ugaStreamUserSession');
                    window.location.href = "index.html?access=locked#login";
                }
                console.log("✅ Server Verification Cleared. Enjoy your movie!");
            } catch (error) {
                console.error("Verification error:", error);
                alert("🚨 System Connection Interrupted. Unable to authenticate your credentials with the cloud server.");
                window.location.href = "index.html";
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGA STREAM — Streaming Theater</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- 🎥 Add Video.js CSS framework styles -->
    <link href="https://zencdn.net" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .watch-header {
            padding: 20px 4%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 100;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #f39c12;
        }
        .download-btn {
            background-color: #e50914; 
            color: white; 
            text-decoration: none; 
            padding: 10px 20px; 
            font-weight: bold; 
            border-radius: 4px;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .download-btn:hover {
            background-color: #b81d24;
        }
        .download-btn:active {
            transform: scale(0.98);
        }
        .player-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            width: 100%;
            height: 100%;
        }
        /* Custom dimensions to scale Video.js beautifully to full cinematic screen */
        .video-js {
            width: 100% !important;
            height: 100% !important;
            max-height: 100vh;
        }
    </style>
</head>
<body>

    <header class="watch-header">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
        <a id="directDownloadBtn" class="download-btn" href="#" target="_blank">
            <i class="fa-solid fa-download"></i> Download Movie
        </a>
    </header>

    <main class="player-container">
        <!-- 🎥 Upgraded structural component layout to support modern streaming frameworks -->
        <video 
            id="ugaStreamVideo" 
            class="video-js vjs-default-skin vjs-big-play-centered" 
            controls 
            autoplay 
            preload="auto">
            Your browser does not support modern streaming frameworks.
        </video>
    </main>

    <!-- 🎥 Add Video.js Compilation Core Script Engine -->
    <script src="https://zencdn.net"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const activeSession = sessionStorage.getItem('subscriberSessionActive') || localStorage.getItem('uga_subscriber_session') === 'true';
            const isAdminBypass = localStorage.getItem('uga_user_status') === 'premium';

            if (!activeSession && !isAdminBypass) {
                alert("🔒 Stream Access Restricted. Please log in or activate a mobile money pass to view this premium translated movie.");
                window.location.href = 'index.html?access=locked';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const movieUrl = urlParams.get('source') || urlParams.get('video');

            if (movieUrl) {
                const clearUrl = decodeURIComponent(movieUrl);
                const downloadBtn = document.getElementById('directDownloadBtn');
                
                // Initialize Video.js engine dynamically
                const player = videojs('ugaStreamVideo');

                // Evaluate content format rules
                if (clearUrl.includes('.m3u8')) {
                    player.src({ src: clearUrl, type: 'application/x-mpegURL' });
                } else {
                    player.src({ src: clearUrl, type: 'video/mp4' });
                }
                
                player.ready(() => {
                    player.play().catch(err => console.log("Autoplay blocked by browser policy"));
                });

                if (downloadBtn) {
                    if (clearUrl.includes('cloudinary.com')) {
                        // Standard conversion format to force raw download generation from streaming strings
                        let forcedDownloadUrl = clearUrl.replace('/sp_auto/', '/');
                        forcedDownloadUrl = forcedDownloadUrl.replace('.m3u8', '.mp4');
                        forcedDownloadUrl = forcedDownloadUrl.replace('/upload/', '/upload/fl_attachment/');
                        downloadBtn.href = forcedDownloadUrl;
                    } else {
                        downloadBtn.href = clearUrl;
                    }
                }
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
