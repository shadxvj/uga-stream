<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGA STREAM — Streaming Theater</title>
    <!-- Fixed broken Cloudflare link to stable FontAwesome icons CDN -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Top Navigation Header bar */
        .watch-header {
            padding: 20px 4%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 100;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #f39c12;
        }
        .download-btn {
            background-color: #e50914; 
            color: white; 
            text-decoration: none; 
            padding: 10px 20px; 
            font-weight: bold; 
            border-radius: 4px;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .download-btn:hover {
            background-color: #b81d24;
        }
        .download-btn:active {
            transform: scale(0.98);
        }
        /* Theater Player Box Container Layout */
        .player-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            width: 100%;
            height: 100%;
        }
        video {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            object-fit: contain; /* Keeps cinema letterboxing intact */
        }
    </style>
</head>
<body>

    <!-- Back Navigation Top Bar Container -->
    <header class="watch-header">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
        <a id="directDownloadBtn" class="download-btn" href="#" target="_blank">
            <i class="fa-solid fa-download"></i> Download Movie
        </a>
    </header>

    <!-- Main Streaming Target Canvas Content -->
    <main class="player-container">
        <video id="ugaStreamVideo" controls autoplay controlsList="nodownload">
            <source id="videoSource" src="" type="video/mp4">
            Your browser does not support HTML video playback mechanics.
        </video>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const movieUrl = urlParams.get('video');

            if (movieUrl) {
                const video = document.getElementById('ugaStreamVideo');
                const videoSource = document.getElementById('videoSource');
                const downloadBtn = document.getElementById('directDownloadBtn');
                
                // Decode the absolute Cloudinary web pathway securely
                const clearUrl = decodeURIComponent(movieUrl);

                // 1. Direct streaming source configuration
                video.src = clearUrl;
                videoSource.src = clearUrl;
                video.load();

                // 2. Cloudinary-specific dynamic forced file download hook configuration
                if (downloadBtn) {
                    if (clearUrl.includes('cloudinary.com')) {
                        // Alters the cloud url to include the 'attachment' flag (fl_attachment) forcing instant download trigger rules
                        const forcedDownloadUrl = clearUrl.replace('/upload/', '/upload/fl_attachment/');
                        downloadBtn.href = forcedDownloadUrl;
                    } else {
                        // Fallback handling standard raw links directly
                        downloadBtn.href = clearUrl;
                    }
                }
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
